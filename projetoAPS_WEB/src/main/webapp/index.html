<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles/styles2.css">
    <title>Login</title>
</head>
<body>
    <main id="form_container">
        <div id="form_header">
            <h1 id="form_title">
                Login
            </h1>
        </div>
        <form action="login.jsp" id="form">
            <div id="input_container">
                <div class="input-box">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-field">
                        <input type="text" id="email" name="email" class="form-control" placeholder="exemplo@gmail.com" maxlength="100">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="input-box">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-field">
                        <input type="password" id="password" name="password" class="form-control" placeholder="********" maxlength="12">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <div class="radio-container"></div>
            </div>
            <button type="submit" class="btn-default">
                <a id="a" href="./pagamento.html">
                    Logar
                </a>
            </button>
            <button type="submit" class="btn-default">
                <a id="a" href="./cadastrar.html">  
                    Cadastrar
                </a>
            </button>
        </form>
    </main>
</body>
</html>
